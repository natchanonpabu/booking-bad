<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Capybara 3: นอนหลับ (ใช้ตอนสนามปิดหรือไม่มีคอร์ทว่าง) -->
  <ellipse cx="80" cy="144" rx="68" ry="8" fill="#000000" opacity="0.08"/>
  <!-- Sleeping Zzz -->
  <g fill="#748CAB" opacity="0.85">
    <path d="M120 48 L130 48 L122 57 L130 57 L130 59 L119 59 L127 50 L119 50 Z"/>
    <path d="M132 32 L140 32 L133 40 L140 40 L140 42 L131 42 L138 34 L131 34 Z"/>
  </g>
  <!-- Curled up Body -->
  <path d="M25 130 C20 100 45 80 75 80 C110 80 135 95 140 130 C140 138 135 142 125 142 L35 142 C28 142 25 138 25 130 Z" fill="#B78A62"/>
  <!-- Resting Head flat on ground -->
  <path d="M20 120 C20 95 40 92 56 92 C72 92 84 100 84 125 C84 138 75 140 60 140 L30 140 C22 140 20 132 20 120 Z" fill="#B78A62"/>
  <!-- Snout resting down -->
  <path d="M16 122 C16 112 25 110 38 110 C50 110 56 116 56 128 C56 138 48 140 36 140 L24 140 C18 140 16 132 16 122 Z" fill="#9E734D"/>
  <ellipse cx="26" cy="122" rx="2" ry="2.5" fill="#3D2614"/>
  <line x1="20" y1="130" x2="30" y2="130" stroke="#3D2614" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Sleeping eye: horizontal line with tiny lash/curve -->
  <path d="M52 108 L62 108" stroke="#1D2D44" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ear flat -->
  <ellipse cx="74" cy="95" rx="6" ry="4" transform="rotate(15 74 95)" fill="#9E734D"/>
  <!-- Navy Scarf curled under neck -->
  <path d="M68 114 C74 116 84 118 90 126 L80 130 Z" fill="#1D2D44"/>
  <!-- Shuttlecock resting on capybara's back while sleeping -->
  <g transform="translate(92, 70)">
    <!-- Shuttlecock cone/feathers -->
    <path d="M10 18 L4 4 L18 4 L12 18 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <line x1="8" y1="4" x2="10" y2="18" stroke="#748CAB" stroke-width="0.8"/>
    <line x1="14" y1="4" x2="12" y2="18" stroke="#748CAB" stroke-width="0.8"/>
    <ellipse cx="11" cy="4" rx="7" ry="2" stroke="#DDA15E" stroke-width="1" fill="#FFFFFF"/>
    <!-- Cork ball -->
    <ellipse cx="11" cy="19" rx="3.5" ry="3" fill="#DDA15E"/>
  </g>
  <!-- Racket laying beside on the floor -->
  <g transform="rotate(6 70 142)">
    <line x1="45" y1="144" x2="135" y2="144" stroke="#748CAB" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="144" x2="135" y2="144" stroke="#DDA15E" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="30" cy="144" rx="16" ry="7" stroke="#1D2D44" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
  <!-- Back foot -->
  <ellipse cx="132" cy="138" rx="8" ry="5" fill="#9E734D"/>
</svg>
